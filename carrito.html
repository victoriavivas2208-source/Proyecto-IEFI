<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Racing Garage - Mi carrito</title>
    <link rel="stylesheet" href="recursos/css/componentes.css">
    <link rel="stylesheet" href="recursos/css/index.css">
    <script type="module" src="./recursos/js/carrito-vista.js"></script>
</head>
<body>
    <a class="salto-contenido" href="#contenido">Ir al contenido</a>
    <header class="cabecera-principal">
        <div class="cabecera-interior">
            <a href="./index.html">
                <img src="./recursos/imagenes/logo.svg" alt="logo Racing Garage">
            </a>

            <nav aria-label="Principal">
                <a href="./index.html">Inicio</a>
                <a href="./catalogo.html">Catálogo</a>
                <a href="./nosotros.html">Nosotros</a>
                <a href="./contacto.html">Contacto</a>
                <a href="./carrito.html" aria-current="page">Carrito</a>
            </nav>
        </div>
    </header>
    <main id="contenido" tabindex="-1" class="contenido-principal">
        <h1>Mi carrito</h1>

        <div class="vista-carrito">
            <section>
                <h2>Productos seleccionados</h2>
                <!-- listado interactivo renderizado vía JavaScript -->
                <div class="carrito-productos"></div>
            </section>

            <section class="resumen-pedido">
                <h2>Resumen del pedido</h2>
                <ul aria-live="polite" aria-atomic="true">
                    <li><span>Subtotal</span> <span>$ 0</span></li>
                    <li><span>Envío</span> <span>Gratis</span></li>
                    <li><span>Total</span> <span>$ 0</span></li>
                </ul>

                <a class="boton-principal" href="./finalizar-compra.html">Continuar con el pedido</a>
                <a class="vinculo-secundario" href="./catalogo.html">Seguir comprando</a>
            </section>
        </div>
    </main>
    <footer class="pie-principal">
        <ul class="pie-lista">
            <li>
                <a href="https://instagram.com/@racinggarage" target="_blank" aria-label="Seguinos en Instagram, se abre en una pestaña nueva">
                    @racinggarage
                </a>
            </li>
            <li>
                Córdoba, Argentina
            </li>
        </ul>
    </footer>
</body>
</html>
