<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Racing Garage - Contacto</title>
    <link rel="stylesheet" href="recursos/css/componentes.css">
    <link rel="stylesheet" href="recursos/css/index.css">
    <script type="module" src="./recursos/js/contacto.js"></script>
</head>
<body>
    <a class="salto-contenido" href="#contenido">Ir al contenido</a>
    <header class="cabecera-principal">
        <div class="cabecera-interior">
            <a href="./index.html">
                <img src="./recursos/imagenes/logo.svg" alt="logo Racing Garage">
            </a>

            <nav aria-label="Principal">
                <a href="./index.html">Inicio</a>
                <a href="./catalogo.html">Catálogo</a>
                <a href="./nosotros.html">Nosotros</a>
                <a href="./contacto.html" aria-current="page">Contacto</a>
                <a href="./carrito.html">Carrito</a>
            </nav>
        </div>
    </header>
    <main id="contenido" tabindex="-1" class="contenido-principal">
        <h1>Contacto</h1>
        <div class="contacto-distribucion">
            <section class="panel">
                <h2 id="titulo-contacto">Escribinos</h2>
                <form class="formulario" action="./contacto.html" method="post" aria-labelledby="titulo-contacto">
                    <div class="campo-formulario">
                        <label for="id-nombre">Nombre</label>
                        <input type="text" name="nombre" id="id-nombre" autocomplete="name" required>
                    </div>
                    <div class="campo-formulario">
                        <label for="id-email">Email</label>
                        <input type="email" name="email" id="id-email" autocomplete="email" required>
                    </div>
                    <div class="campo-formulario">
                        <label for="id-mensaje">Mensaje</label>
                        <textarea name="mensaje" id="id-mensaje" required></textarea>
                    </div>
                    <button class="boton-principal" type="submit">Enviar</button>
                </form>
            </section>
            <section class="panel">
                <h2>Dónde estamos</h2>
                <p>Córdoba, Argentina</p>
                <iframe class="mapa" src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3404.69!2d-64.1868!3d-31.4226!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x0%3A0x0!2sC%C3%B3rdoba!5e0!3m2!1ses-419!2sar!4v0000000000!5m2!1ses-419!2sar" width="600" height="450" allowfullscreen="" loading="lazy" referrerpolicy="strict-origin-when-cross-origin" title="Ubicación de Racing Garage en el mapa"></iframe>
            </section>
        </div>
    </main>
    <footer class="pie-principal">
        <ul class="pie-lista">
            <li>
                <a href="https://instagram.com/@racinggarage" target="_blank" aria-label="Seguinos en Instagram, se abre en una pestaña nueva">
                    @racinggarage
                </a>
            </li>
            <li>
                Córdoba, Argentina
            </li>
        </ul>
    </footer>
</body>
</html>
