name: Pruebas del carrito

on:
  push:
    branches:
      - codex/demo-impuestos

permissions:
  contents: read

jobs:
  probar-carrito:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v6
      - name: Preparar Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Instalar dependencias
        run: npm ci
      - name: Ejecutar pruebas con Vitest
        run: npm test
